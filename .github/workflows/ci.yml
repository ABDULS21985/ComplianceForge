name: ComplianceForge CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: "1.26.8"
  NODE_VERSION: "24.21.0"
  KUBECTL_VERSION: "v1.37.0"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate threat model and security governance records
        run: ./scripts/validate-security-governance.sh

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --timeout=5m
          only-new-issues: true

      - name: Run go vet
        run: go vet ./...

  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: complianceforge
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: complianceforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U complianceforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql/data:rw
      redis:
        image: redis:7.4.11-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /data:rw
      rabbitmq:
        image: rabbitmq:4.3.5-alpine@sha256:3486d98205df3d6395ed70e7924baa13b561cbac54116c0ddae5b0b7382bbabd
        env:
          RABBITMQ_DEFAULT_USER: complianceforge
          RABBITMQ_DEFAULT_PASS: testpassword
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Verify clean migration round trip
        env:
          DATABASE_URL: postgres://complianceforge:testpassword@localhost:5432/complianceforge_test?sslmode=disable
        run: |
          ./scripts/validate-migrations.sh
          go run ./cmd/migrate up
          go run ./cmd/migrate down
          go run ./cmd/migrate up

      - name: Verify deterministic reference-data seeds
        env:
          DATABASE_URL: postgres://complianceforge:testpassword@localhost:5432/complianceforge_test?sslmode=disable
        run: |
          go run ./cmd/seed
          go run ./cmd/seed

      - name: Verify RabbitMQ and durable delivery contracts
        env:
          RABBITMQ_URL: amqp://complianceforge:testpassword@localhost:5672/
          TEST_DATABASE_URL: postgres://complianceforge:testpassword@localhost:5432/complianceforge_test?sslmode=disable
        run: >-
          go test -tags=integration
          -run 'TestRabbitMQDeliveryContract|TestPostgresOutboxInboxAndRabbitMQContract|TestPostgresSchedulerLeaseContentionAndStaleRecovery'
          -v ./internal/pkg/queue ./internal/pkg/coordination

      - name: Verify distributed API-key rate limiting
        env:
          REDIS_URL: redis://localhost:6379/0
        run: go test -tags=integration -run TestRedisAPIKeyLimiterIsSharedAndAtomic -v ./internal/pkg/ratelimit

      - name: Run tests
        env:
          DATABASE_URL: postgres://complianceforge:testpassword@localhost:5432/complianceforge_test?sslmode=disable
          TEST_DATABASE_URL: postgres://complianceforge:testpassword@localhost:5432/complianceforge_test?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run bounded security and state-machine fuzzing
        env:
          FUZZ_TIME: 2s
        run: ./scripts/run-fuzz-smoke.sh

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: coverage.out

      - name: Enforce backend coverage threshold (60%)
        run: |
          coverage=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          echo "Total coverage: ${coverage}%"
          awk -v c="$coverage" 'BEGIN { if (c+0 < 60) { printf("Coverage below threshold: %s%% < 60%%\n", c); exit 1 } }'

      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.out
          flags: backend
          fail_ci_if_error: false

      # This intentionally tightens ACLs in the disposable service database,
      # so it runs after other database contracts that use legacy local grants.
      - name: Verify convergent split-role database posture and scheduler contracts
        env:
          TEST_DATABASE_URL: postgres://complianceforge:testpassword@localhost:5432/complianceforge_test?sslmode=disable
          PSQL_DOCKER_CONTAINER: ${{ job.services.postgres.id }}
          PSQL_DATABASE_URL: postgres://complianceforge:testpassword@127.0.0.1:5432/complianceforge_test?sslmode=disable
          RUNTIME_ROLE_SMOKE_CONFIRM_DISPOSABLE: 'yes'
        run: ./scripts/validate-runtime-database-roles.sh

  api-contract:
    name: OpenAPI 3.1 Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate generated contract, mounted routes, and payload drift
        run: ./scripts/validate-openapi.sh

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: [api-contract, backend-lint, backend-test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Build api binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/api cmd/api/main.go

      - name: Build worker binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/worker cmd/worker/main.go

      - name: Build migrate binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/migrate cmd/migrate/main.go

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-binaries
          path: bin/

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        # Temporary measured baseline: any new warning blocks CI. See the
        # supply-chain runbook; restore zero as the frontend backlog burns down.
        run: npx eslint . --max-warnings=771

      - name: Run Prettier check
        run: npm run format:check

      - name: Run TypeScript check
        run: npm run type-check

  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [api-contract, frontend-lint, frontend-test]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify standalone output exists
        run: test -f .next/standalone/server.js

  observability-config:
    name: Observability Configuration
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate pinned image pulls
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Validate dashboards, scrape configuration, rules, and collectors
        run: ./scripts/validate-observability.sh

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: complianceforge
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: complianceforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U complianceforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql/data:rw
      redis:
        image: redis:7.4.11-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /data:rw
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Run DB migrations
        env:
          DATABASE_URL: postgres://complianceforge:testpassword@localhost:5432/complianceforge_test?sslmode=disable
        run: go run ./cmd/migrate up

      - name: Seed test data
        env:
          DATABASE_URL: postgres://complianceforge:testpassword@localhost:5432/complianceforge_test?sslmode=disable
        run: go run ./cmd/seed

      - name: Start API server
        env:
          APP_ENV: test
          PORT: 8080
          DATABASE_URL: postgres://complianceforge:testpassword@localhost:5432/complianceforge_test?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
        run: |
          go run cmd/api/main.go > /tmp/api.log 2>&1 &

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start frontend server
        working-directory: frontend
        env:
          API_INTERNAL_URL: http://127.0.0.1:8080/api/v1
          APP_ENV: test
        run: |
          npm run start -- --port 3000 > /tmp/frontend.log 2>&1 &

      - name: Wait for API and frontend
        run: |
          timeout 60s bash -c 'until curl -sSf http://localhost:8080/health/ready >/dev/null; do sleep 2; done'
          timeout 60s bash -c 'until curl -sSf http://localhost:3000 >/dev/null; do sleep 2; done'

      - name: Run Playwright tests
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-test-results
          path: frontend/test-results

      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-service-logs
          path: |
            /tmp/api.log
            /tmp/frontend.log

  security-scan:
    name: Supply-chain and Container Security
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build, e2e-tests, observability-config]
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install checksum-pinned scanners
        env:
          TOOLS_DIR: ${{ runner.temp }}/security-tools/bin
        run: ./scripts/ci/install-security-tools.sh

      - name: Create report directory
        run: mkdir -p security-reports/sbom

      - name: Lint GitHub Actions workflows
        run: actionlint

      - name: Lint operational shell scripts
        run: find scripts -type f -name '*.sh' -exec shellcheck --severity=warning {} +

      - name: Scan Git history for secrets
        id: gitleaks
        continue-on-error: true
        run: >-
          gitleaks git . --redact --no-banner --exit-code 1
          --report-format sarif --report-path security-reports/gitleaks.sarif

      - name: Run Go static security analysis
        id: gosec
        continue-on-error: true
        run: gosec -fmt=sarif -out=security-reports/gosec.sarif ./...

      - name: Scan reachable Go dependencies
        id: govulncheck
        continue-on-error: true
        # Machine-readable formats intentionally exit zero even when findings
        # exist. Text mode preserves govulncheck's blocking exit status.
        run: govulncheck -format text -show version ./... > security-reports/govulncheck.txt

      - name: Materialize frontend dependency graph without lifecycle scripts
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit

      - name: Audit frontend dependency lockfile
        id: npm-audit
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high --json > ../security-reports/npm-audit.json

      - name: Scan source dependencies, secrets, and IaC
        id: source-trivy
        continue-on-error: true
        run: >-
          trivy fs . --scanners vuln,misconfig,secret
          --include-dev-deps
          --skip-dirs .git --skip-dirs frontend/node_modules --skip-dirs frontend/.next
          --severity HIGH,CRITICAL --exit-code 1 --format json
          --output security-reports/trivy-filesystem.json

      - name: Enforce dependency license policy
        id: license-trivy
        continue-on-error: true
        run: >-
          trivy fs frontend --scanners license --license-full --include-dev-deps
          --skip-dirs .next --severity HIGH,CRITICAL --exit-code 1 --format json
          --output security-reports/trivy-licenses.json

      - name: Authenticate base-image pulls
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build production image targets
        run: |
          docker build --target api -f deployments/docker/Dockerfile.api -t complianceforge-api:scan .
          docker build --target worker -f deployments/docker/Dockerfile.api -t complianceforge-worker:scan .
          docker build --target migrator -f deployments/docker/Dockerfile.api -t complianceforge-migrator:scan .
          docker build -f deployments/docker/Dockerfile.frontend -t complianceforge-frontend:scan ./frontend

      - name: Generate SPDX SBOMs
        run: |
          for component in api worker migrator frontend; do
            syft "complianceforge-${component}:scan" \
              --output "spdx-json=security-reports/sbom/${component}.spdx.json"
          done

      - name: Scan every runtime image
        id: image-trivy
        continue-on-error: true
        run: |
          status=0
          for component in api worker migrator frontend; do
            trivy image "complianceforge-${component}:scan" \
              --scanners vuln --severity HIGH,CRITICAL \
              --exit-code 1 --format json \
              --output "security-reports/trivy-${component}.json" || status=1
          done
          exit "$status"

      - name: Upload security evidence and SBOMs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-evidence-${{ github.sha }}
          path: security-reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce security gates
        if: always()
        env:
          GITLEAKS: ${{ steps.gitleaks.outcome }}
          GOSEC: ${{ steps.gosec.outcome }}
          GOVULNCHECK: ${{ steps.govulncheck.outcome }}
          NPM_AUDIT: ${{ steps.npm-audit.outcome }}
          SOURCE_TRIVY: ${{ steps.source-trivy.outcome }}
          LICENSE_TRIVY: ${{ steps.license-trivy.outcome }}
          IMAGE_TRIVY: ${{ steps.image-trivy.outcome }}
        run: |
          status=0
          for gate in GITLEAKS GOSEC GOVULNCHECK NPM_AUDIT SOURCE_TRIVY LICENSE_TRIVY IMAGE_TRIVY; do
            eval "outcome=\${$gate}"
            if [ "$outcome" != success ]; then
              echo "Security gate $gate finished with: $outcome" >&2
              status=1
            fi
          done
          exit "$status"

  docker-build:
    name: Build Production Image (${{ matrix.component }})
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [security-scan]
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: .
            file: deployments/docker/Dockerfile.api
            target: api
          - component: worker
            context: .
            file: deployments/docker/Dockerfile.api
            target: worker
          - component: migrator
            context: .
            file: deployments/docker/Dockerfile.api
            target: migrator
          - component: frontend
            context: ./frontend
            file: deployments/docker/Dockerfile.frontend
            target: runner
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate base-image pulls
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push immutable image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.component }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  docker-build-staging:
    name: Build Staging Image (${{ matrix.component }})
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [security-scan]
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: .
            file: deployments/docker/Dockerfile.api
            target: api
          - component: worker
            context: .
            file: deployments/docker/Dockerfile.api
            target: worker
          - component: migrator
            context: .
            file: deployments/docker/Dockerfile.api
            target: migrator
          - component: frontend
            context: ./frontend
            file: deployments/docker/Dockerfile.frontend
            target: runner
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate base-image pulls
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push immutable staging image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.component }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=staging-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=staging-${{ matrix.component }}

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [docker-build-staging]
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Configure kubeconfig
        run: |
          install -d -m 0700 "$RUNNER_TEMP/kube"
          printf '%s' "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 --decode > "$RUNNER_TEMP/kube/config"
          chmod 0600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"

      - name: Deploy API (staging)
        run: |
          kubectl -n "${{ vars.K8S_NAMESPACE_STAGING }}" set image deployment/"${{ vars.K8S_API_DEPLOYMENT_STAGING }}" \
            api="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:sha-${{ github.sha }}"
          kubectl -n "${{ vars.K8S_NAMESPACE_STAGING }}" rollout status deployment/"${{ vars.K8S_API_DEPLOYMENT_STAGING }}" --timeout=180s

      - name: Deploy Frontend (staging)
        run: |
          kubectl -n "${{ vars.K8S_NAMESPACE_STAGING }}" set image deployment/"${{ vars.K8S_FRONTEND_DEPLOYMENT_STAGING }}" \
            frontend="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:sha-${{ github.sha }}"
          kubectl -n "${{ vars.K8S_NAMESPACE_STAGING }}" rollout status deployment/"${{ vars.K8S_FRONTEND_DEPLOYMENT_STAGING }}" --timeout=180s

      - name: Deploy to staging
        run: |
          echo "Staging deployment completed for ${GITHUB_SHA}."

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docker-build]
    environment: production
    permissions:
      contents: read
    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Configure kubeconfig
        run: |
          install -d -m 0700 "$RUNNER_TEMP/kube"
          printf '%s' "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 --decode > "$RUNNER_TEMP/kube/config"
          chmod 0600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"

      - name: Deploy API (production)
        run: |
          kubectl -n "${{ vars.K8S_NAMESPACE_PRODUCTION }}" set image deployment/"${{ vars.K8S_API_DEPLOYMENT_PRODUCTION }}" \
            api="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:sha-${{ github.sha }}"
          kubectl -n "${{ vars.K8S_NAMESPACE_PRODUCTION }}" rollout status deployment/"${{ vars.K8S_API_DEPLOYMENT_PRODUCTION }}" --timeout=300s

      - name: Deploy Frontend (production)
        run: |
          kubectl -n "${{ vars.K8S_NAMESPACE_PRODUCTION }}" set image deployment/"${{ vars.K8S_FRONTEND_DEPLOYMENT_PRODUCTION }}" \
            frontend="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:sha-${{ github.sha }}"
          kubectl -n "${{ vars.K8S_NAMESPACE_PRODUCTION }}" rollout status deployment/"${{ vars.K8S_FRONTEND_DEPLOYMENT_PRODUCTION }}" --timeout=300s

      - name: Deploy to production
        run: |
          echo "Production deployment completed for ${GITHUB_SHA}."
