name: Dependency and License Review

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Block vulnerable or unapproved dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes and licenses
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          license-check: true
          vulnerability-check: true
          allow-licenses: >-
            0BSD, Apache-2.0, BSD-2-Clause, BSD-3-Clause, CC0-1.0, ISC,
            MIT, MPL-2.0, Python-2.0, Unicode-3.0, Unlicense, Zlib,
            BlueOak-1.0.0
          show-openssf-scorecard: true
          warn-on-openssf-scorecard-level: 4
