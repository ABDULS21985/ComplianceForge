# Single-host production topology. Stateful services are intentionally external:
# supply TLS-enabled PostgreSQL/Redis/RabbitMQ and S3-compatible object storage.

x-backend-environment: &backend-environment
  APP_ENV: production
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL with sslmode=require or verify-full is required}
  REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
  RABBITMQ_URL: ${RABBITMQ_URL:?RABBITMQ_URL with non-guest credentials is required}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET of at least 32 characters is required}
  JWT_ISSUER: ${JWT_ISSUER:-complianceforge}
  DSR_ENCRYPTION_KEY: ${DSR_ENCRYPTION_KEY:?DSR_ENCRYPTION_KEY must be a base64-encoded 32-byte key}
  INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:?INTEGRATION_ENCRYPTION_KEY must be a hex-encoded 32-byte key}
  NOTIFICATION_ENCRYPTION_KEY: ${NOTIFICATION_ENCRYPTION_KEY:?NOTIFICATION_ENCRYPTION_KEY must be a hex-encoded 32-byte key}
  SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required}
  SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
  SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-15}
  SMTP_HELLO_NAME: ${SMTP_HELLO_NAME:-}
  SMTP_SERVER_NAME: ${SMTP_SERVER_NAME:-}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must contain HTTPS origins}
  STORAGE_TYPE: s3
  S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
  S3_REGION: ${S3_REGION:?S3_REGION is required}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: json

services:
  api:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.api
      target: api
    image: ${API_IMAGE:-complianceforge-api}:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      <<: *backend-environment
      API_TRUST_PROXY_HEADERS: "true"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "--output", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    pids_limit: 256
    networks:
      - complianceforge

  worker:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.api
      target: worker
    image: ${WORKER_IMAGE:-complianceforge-worker}:${IMAGE_TAG:?IMAGE_TAG is required}
    environment: *backend-environment
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    pids_limit: 256
    networks:
      - complianceforge

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../deployments/docker/Dockerfile.frontend
    image: ${FRONTEND_IMAGE:-complianceforge-frontend}:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:8080/api/v1
      APP_ENV: production
      TRUST_PROXY_HEADERS: "true"
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    pids_limit: 256
    networks:
      - complianceforge

  nginx:
    image: nginx:1.30.4-alpine@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_PATH:?TLS_CERT_PATH is required}:/etc/nginx/ssl/cert.pem:ro
      - ${TLS_KEY_PATH:?TLS_KEY_PATH is required}:/etc/nginx/ssl/key.pem:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m
      - /var/run:size=8m
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    pids_limit: 256
    networks:
      - complianceforge

networks:
  complianceforge:
    driver: bridge
