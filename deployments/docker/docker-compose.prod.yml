# Single-host production topology. Stateful services are intentionally external:
# supply TLS-enabled PostgreSQL/Redis/RabbitMQ and S3-compatible object storage.

x-backend-environment: &backend-environment
  APP_ENV: production
  REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
  RABBITMQ_URL: ${RABBITMQ_URL:?RABBITMQ_URL with non-guest credentials is required}
  NOTIFICATION_DELIVERY_TENANT_BATCH: ${NOTIFICATION_DELIVERY_TENANT_BATCH:-100}
  NOTIFICATION_DELIVERY_CLAIM_BATCH: ${NOTIFICATION_DELIVERY_CLAIM_BATCH:-100}
  NOTIFICATION_DELIVERY_LEASE: ${NOTIFICATION_DELIVERY_LEASE:-3m}
  NOTIFICATION_RETRY_BASE_DELAY: ${NOTIFICATION_RETRY_BASE_DELAY:-30s}
  NOTIFICATION_RETRY_MAX_DELAY: ${NOTIFICATION_RETRY_MAX_DELAY:-1h}
  NOTIFICATION_DELIVERY_POLL_INTERVAL: ${NOTIFICATION_DELIVERY_POLL_INTERVAL:-10s}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET of at least 32 characters is required}
  JWT_ISSUER: ${JWT_ISSUER:-complianceforge}
  DSR_ENCRYPTION_KEY: ${DSR_ENCRYPTION_KEY:?DSR_ENCRYPTION_KEY must be a base64-encoded 32-byte key}
  INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:?INTEGRATION_ENCRYPTION_KEY must be a hex-encoded 32-byte key}
  NOTIFICATION_ENCRYPTION_KEY: ${NOTIFICATION_ENCRYPTION_KEY:?NOTIFICATION_ENCRYPTION_KEY must be a hex-encoded 32-byte key}
  SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required}
  SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
  SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-15}
  SMTP_HELLO_NAME: ${SMTP_HELLO_NAME:-}
  SMTP_SERVER_NAME: ${SMTP_SERVER_NAME:-}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must contain HTTPS origins}
  STORAGE_TYPE: s3
  S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
  S3_REGION: ${S3_REGION:?S3_REGION is required}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  S3_KMS_KEY_ID: ${S3_KMS_KEY_ID:-}
  S3_EXPECTED_BUCKET_OWNER: ${S3_EXPECTED_BUCKET_OWNER:?S3_EXPECTED_BUCKET_OWNER is required}
  EVIDENCE_MAXIMUM_UPLOAD_BYTES: ${EVIDENCE_MAXIMUM_UPLOAD_BYTES:-26214400}
  EVIDENCE_SCANNER_NETWORK: ${EVIDENCE_SCANNER_NETWORK:-tcp}
  EVIDENCE_SCANNER_ADDRESS: ${EVIDENCE_SCANNER_ADDRESS:?EVIDENCE_SCANNER_ADDRESS must identify an isolated clamd service}
  EVIDENCE_SCANNER_TIMEOUT_SECONDS: ${EVIDENCE_SCANNER_TIMEOUT_SECONDS:-30}
  EVIDENCE_SIGNED_DOWNLOAD_SECONDS: ${EVIDENCE_SIGNED_DOWNLOAD_SECONDS:-300}
  HTTP_READ_HEADER_TIMEOUT_SECONDS: ${HTTP_READ_HEADER_TIMEOUT_SECONDS:-5}
  HTTP_READ_TIMEOUT_SECONDS: ${HTTP_READ_TIMEOUT_SECONDS:-120}
  HTTP_WRITE_TIMEOUT_SECONDS: ${HTTP_WRITE_TIMEOUT_SECONDS:-360}
  HTTP_IDLE_TIMEOUT_SECONDS: ${HTTP_IDLE_TIMEOUT_SECONDS:-60}
  HTTP_SHUTDOWN_TIMEOUT_SECONDS: ${HTTP_SHUTDOWN_TIMEOUT_SECONDS:-30}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: json
  OBSERVABILITY_METRICS_ENABLED: "true"
  OBSERVABILITY_METRICS_ADDRESS: 0.0.0.0:9091
  OBSERVABILITY_METRICS_TOKEN_FILE: /run/secrets/metrics_token
  OBSERVABILITY_TRACING_ENABLED: ${OBSERVABILITY_TRACING_ENABLED:-true}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
  OBSERVABILITY_TRACE_SAMPLE_RATIO: ${OBSERVABILITY_TRACE_SAMPLE_RATIO:-0.1}
  OBSERVABILITY_SHUTDOWN_TIMEOUT_SECONDS: 10
  SERVICE_VERSION: ${IMAGE_TAG:?IMAGE_TAG is required}

services:
  api:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.api
      target: api
    image: ${API_IMAGE:-complianceforge-api}:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      <<: *backend-environment
      # Dedicated non-owner runtime login. Schema changes use the separately
      # supplied MIGRATION_DATABASE_URL outside the API container lifecycle.
      DATABASE_URL: ${API_DATABASE_URL:?API_DATABASE_URL for a dedicated non-owner API login with TLS is required}
      API_TRUST_PROXY_HEADERS: "true"
    expose:
      - "8080"
      - "9091"
    secrets:
      - metrics_token
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "--output", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    pids_limit: 256
    networks:
      - complianceforge
      - telemetry

  worker:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.api
      target: worker
    image: ${WORKER_IMAGE:-complianceforge-worker}:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      <<: *backend-environment
      # The worker login is separate from both the API and migration identities.
      # Grant only the scheduler and tenant-scoped worker capabilities it needs.
      DATABASE_URL: ${WORKER_DATABASE_URL:?WORKER_DATABASE_URL for a dedicated non-owner worker login with TLS is required}
    expose:
      - "9091"
    secrets:
      - metrics_token
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "--output", "/dev/null", "http://127.0.0.1:9091/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    pids_limit: 256
    networks:
      - complianceforge
      - telemetry

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../deployments/docker/Dockerfile.frontend
    image: ${FRONTEND_IMAGE:-complianceforge-frontend}:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:8080/api/v1
      APP_ENV: production
      TRUST_PROXY_HEADERS: "true"
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    pids_limit: 256
    networks:
      - complianceforge

  nginx:
    image: nginx:1.30.4-alpine@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_PATH:?TLS_CERT_PATH is required}:/etc/nginx/ssl/cert.pem:ro
      - ${TLS_KEY_PATH:?TLS_KEY_PATH is required}:/etc/nginx/ssl/key.pem:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m
      - /var/run:size=8m
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    pids_limit: 256
    networks:
      - complianceforge

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0@sha256:799dc6cf12c96192af37b5bdba804da8c10b3bc563b43cb90c3f3c58d9572ad6
    command: ["--config=/etc/otelcol/config.yml"]
    environment:
      OTEL_TRACE_UPSTREAM_ENDPOINT: ${OTEL_TRACE_UPSTREAM_ENDPOINT:?OTEL_TRACE_UPSTREAM_ENDPOINT is required}
      OTEL_TRACE_UPSTREAM_AUTHORIZATION: ${OTEL_TRACE_UPSTREAM_AUTHORIZATION:-}
    volumes:
      - ../observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    pids_limit: 256
    networks:
      - complianceforge
      - telemetry

  prometheus:
    image: prom/prometheus:v3.13.3@sha256:6976aa8a60fec930796ce5772b8d12da7a318a5daa8d40d69c5c7819a05eeed7
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-lifecycle=false
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    secrets:
      - metrics_token
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    pids_limit: 256
    networks:
      - telemetry

  grafana:
    image: grafana/grafana:13.2.1@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3001}:3000
    depends_on:
      - prometheus
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    pids_limit: 256
    networks:
      - telemetry

volumes:
  prometheus_data:
  grafana_data:

secrets:
  metrics_token:
    file: ${OBSERVABILITY_METRICS_TOKEN_SOURCE:?OBSERVABILITY_METRICS_TOKEN_SOURCE is required}

networks:
  complianceforge:
    driver: bridge
  telemetry:
    driver: bridge
    internal: true
