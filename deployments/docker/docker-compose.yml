x-backend-environment: &backend-environment
  APP_ENV: development
  APP_PORT: 8080
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: complianceforge
  DB_PASSWORD: ${DB_PASSWORD:-complianceforge}
  DB_NAME: complianceforge
  DB_SSL_MODE: disable
  REDIS_HOST: redis
  REDIS_PORT: 6379
  RABBITMQ_URL: amqp://complianceforge:${RABBITMQ_PASSWORD:-complianceforge}@rabbitmq:5672/
  JWT_SECRET: ${JWT_SECRET:-development-only-jwt-secret}
  DSR_ENCRYPTION_KEY: ${DSR_ENCRYPTION_KEY:-ZGV2ZWxvcG1lbnQtZHNyLWtleS0zMi1ieXRlcyEhISE=}
  INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-646576656c6f706d656e742d696e746567726174696f6e2d6b65792d33326221}
  NOTIFICATION_ENCRYPTION_KEY: ${NOTIFICATION_ENCRYPTION_KEY:-6e6f74696669636174696f6e2d6465762d6b65792d33322d62797465732d3031}
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  SMTP_FROM: noreply@complianceforge.local
  SMTP_TLS_MODE: disabled
  SMTP_TIMEOUT_SECONDS: 15
  STORAGE_TYPE: local
  STORAGE_PATH: /app/storage
  CORS_ALLOWED_ORIGINS: http://localhost:3000
  LOG_LEVEL: debug

services:
  migrate:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.api
      target: migrator
    environment: *backend-environment
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - complianceforge

  api:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.api
      target: api
    environment:
      <<: *backend-environment
      API_TRUST_PROXY_HEADERS: "false"
    ports:
      - "8080:8080"
    volumes:
      - app_storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    networks:
      - complianceforge

  worker:
    build:
      context: ../../
      dockerfile: deployments/docker/Dockerfile.api
      target: worker
    environment: *backend-environment
    volumes:
      - app_storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    networks:
      - complianceforge

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../deployments/docker/Dockerfile.frontend
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:8080/api/v1
      APP_ENV: development
      TRUST_PROXY_HEADERS: "false"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    networks:
      - complianceforge

  postgres:
    image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: complianceforge
      POSTGRES_PASSWORD: ${DB_PASSWORD:-complianceforge}
      POSTGRES_DB: complianceforge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U complianceforge -d complianceforge"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - complianceforge

  redis:
    image: redis:7.4.11-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - complianceforge

  rabbitmq:
    image: rabbitmq:4.3.5-management-alpine@sha256:b3b8b7f95f5382a19f9ea33540e604f30aad081d37ad9aba72255135765373a1
    environment:
      RABBITMQ_DEFAULT_USER: complianceforge
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-complianceforge}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - complianceforge

  mailpit:
    image: axllent/mailpit:v1.31.1@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped
    networks:
      - complianceforge

volumes:
  app_storage:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  complianceforge:
    driver: bridge
