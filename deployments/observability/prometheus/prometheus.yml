global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: complianceforge-api
    scheme: http
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: [api:9091]

  - job_name: complianceforge-worker
    scheme: http
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: [worker:9091]

  - job_name: prometheus
    static_configs:
      - targets: [127.0.0.1:9090]

  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]
